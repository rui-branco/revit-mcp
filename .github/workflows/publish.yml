name: publish

# Publishes to npm. This is the ONLY place a release is published from:
# `npm publish` outside GitHub Actions is refused by prepublishOnly.
#
# Runs on Windows because the add-in targets net8.0-windows. It does NOT need
# Revit installed: the Revit API arrives as a reference-only NuGet package
# (Revit_All_Main_Versions_API_x64), so a stock runner compiles it fine.
#
# Trigger it by publishing a GitHub release, or by hand from the Actions tab.
#
# npm auth: a trusted publisher on npmjs.com (OIDC, no secret), or an
# NPM_TOKEN repo secret as the fallback.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which trusted publishing needs (>= 11.5.1).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # The exact SDK from global.json: a different compiler can emit different
      # bytes, and the stale check below compares bytes.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: npm ci

      # Rebuilt here rather than trusting the committed binary, so the tarball
      # can never ship a DLL older than the source next to it.
      - name: Build the Revit bridge
        run: npm run build:bridge

      - name: Fail if the committed add-in is stale
        shell: bash
        run: |
          if ! git diff --quiet -- revit-bridge/dist/; then
            echo "revit-bridge/dist/ differs from a fresh Release build. Run 'npm run build:bridge' and commit the result."
            git diff --stat -- revit-bridge/dist/
            exit 1
          fi
          echo "committed add-in matches a fresh build"

      - run: npm test

      - name: Publish to npm
        if: inputs.dry_run != true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
