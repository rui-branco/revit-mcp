name: publish

# Publishes to npm and attaches the Claude Desktop extension to the release.
#
# Runs on Windows because the add-in targets net8.0-windows. It does NOT need
# Revit installed: the Revit API arrives as a reference-only NuGet package
# (Revit_All_Main_Versions_API_x64), so a stock runner compiles it fine.
#
# Trigger it by publishing a GitHub release, or by hand from the Actions tab.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write # upload the .mcpb to the release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci

      # Rebuilt here rather than trusting the committed binary, so the tarball
      # and the .mcpb can never ship a DLL older than the source next to it.
      - name: Build the Revit bridge
        run: npm run build:bridge

      - name: Fail if the committed add-in is stale
        shell: bash
        run: |
          if ! git diff --quiet -- revit-bridge/dist/; then
            echo "revit-bridge/dist/ differs from a fresh Release build. Run 'npm run build:bridge' and commit the result."
            git diff --stat -- revit-bridge/dist/
            exit 1
          fi
          echo "committed add-in matches a fresh build"

      - run: npm test

      - name: Pack the Claude Desktop extension
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack . revit-mcp.mcpb

      - name: Publish to npm
        if: inputs.dry_run != true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the extension to the release
        if: github.event_name == 'release' && inputs.dry_run != true
        run: gh release upload "${{ github.event.release.tag_name }}" revit-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: revit-mcp.mcpb
          path: revit-mcp.mcpb
